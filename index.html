<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kassa</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --card:#ffffff; --line:#e6e8ee; --tx:#12141a; --mut:#7b8291;
  --acc:#0fb27a; --acc2:#0a8f62; --key:#ffffff; --keyp:#e9ecf2; --sel:#0fb27a14;
  --shadow:0 1px 2px #0000000d,0 4px 14px #0000000a;
  --h:var(--tg-viewport-stable-height,100dvh);
  --safe:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#0c0e12; --card:#161920; --line:#242833; --tx:#f2f4f7; --mut:#8a92a3;
  --acc:#22d391; --acc2:#16b077; --key:#1c2029; --keyp:#2a303c; --sel:#22d39118;
  --shadow:0 1px 0 #ffffff08 inset,0 6px 18px #00000040;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:Manrope,-apple-system,system-ui,Roboto,sans-serif;color:var(--tx);font-variant-numeric:tabular-nums}
.app{height:var(--h);display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding:clamp(8px,1.6dvh,14px) clamp(10px,3.5vw,16px) calc(clamp(8px,1.4dvh,12px) + var(--safe))}

/* total */
.top{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:20px;
  padding:clamp(10px,1.8dvh,16px) clamp(14px,4vw,18px);box-shadow:0 8px 24px #0fb27a40;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:#ffffff1f}
.top .lbl{display:flex;justify-content:space-between;align-items:center;font-size:clamp(11px,3.2vw,13px);font-weight:600;opacity:.9;position:relative;z-index:1}
.top .sum{font-size:clamp(26px,9.5vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.top .sum span{font-size:.45em;font-weight:700;opacity:.85;margin-left:4px}
.tools{display:flex;gap:6px}
.tools button{border:0;background:#ffffff2e;color:#fff;font:inherit;font-weight:700;font-size:clamp(11px,3vw,12px);
  padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:4px}
.tools button:active{background:#ffffff4d}
.tools svg{width:14px;height:14px}

/* list */
.list{flex:1;min-height:0;overflow-y:auto;margin:clamp(8px,1.4dvh,12px) 0;display:flex;flex-direction:column;gap:clamp(5px,0.8dvh,8px);
  scrollbar-width:none;overscroll-behavior:contain}
.list::-webkit-scrollbar{display:none}
.row{flex:1 0 auto;min-height:clamp(44px,6.3dvh,62px);max-height:72px;background:var(--card);border:2px solid transparent;border-radius:16px;
  display:flex;align-items:center;gap:12px;padding:0 clamp(10px,3vw,14px);box-shadow:var(--shadow);transition:border-color .15s,background .15s,transform .1s}
.row:active{transform:scale(.99)}
.row.on{border-color:var(--acc);background:linear-gradient(var(--sel),var(--sel)),var(--card)}
.note{width:clamp(62px,19vw,84px);aspect-ratio:152/69;max-height:calc(100% - 10px);flex:none;border-radius:6px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 78% 50%,#ffffff55 0 18%,transparent 19%),
    repeating-linear-gradient(115deg,#ffffff14 0 2px,transparent 2px 6px),
    linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));
  box-shadow:0 2px 6px #00000030,inset 0 0 0 1px #ffffff40;transform:rotate(-2deg);transition:transform .2s}
.note:before{content:"";position:absolute;inset:3px;border:1px solid #ffffff55;border-radius:4px}
.note i{position:absolute;left:5px;top:3px;font-style:normal;font-weight:800;color:#fff;font-size:clamp(8px,2.4vw,10.5px);letter-spacing:-.02em;text-shadow:0 1px 2px #0005}
.note em{position:absolute;right:5px;bottom:2px;font-style:normal;font-weight:800;color:#ffffffd0;font-size:clamp(6px,1.8vw,8px)}
.note img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.note.img img{display:block}
.note.img i,.note.img em,.note.img:before{display:none}
.row.on .note{transform:rotate(0) scale(1.06)}
.den{flex:1;min-width:0}
.den b{display:block;font-size:clamp(15px,4.5vw,18px);font-weight:800;letter-spacing:-.01em}
.den small{display:block;font-size:clamp(11px,3.1vw,12.5px);color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.has .den small{color:var(--acc)}
.qty{min-width:clamp(52px,15vw,68px);height:clamp(32px,4.6dvh,40px);border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:clamp(17px,5vw,21px);font-weight:800;color:var(--mut);padding:0 8px}
.row.has .qty{color:var(--tx)}
.row.on .qty{background:var(--card);box-shadow:inset 0 0 0 2px var(--acc);color:var(--tx)}
.row.on .qty:after{content:"";width:2px;height:1.05em;background:var(--acc);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.8vw,9px);
  grid-auto-rows:clamp(42px,7.2dvh,62px)}
.k{border:0;border-radius:14px;background:var(--key);color:var(--tx);font:inherit;font-weight:700;font-size:clamp(20px,6vw,26px);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:4px;transition:transform .08s,background .08s}
.k:active{transform:scale(.95);background:var(--keyp)}
.k.f{font-size:clamp(14px,4vw,17px);color:var(--mut)}
.k.f svg{width:24px;height:24px}
.k.go{grid-row:span 2;background:var(--acc);color:#fff;flex-direction:column;font-size:clamp(14px,4vw,17px);box-shadow:0 6px 16px #0fb27a40}
.k.go:active{background:var(--acc2)}
.k.go svg{width:26px;height:26px}
.k.go small{font-size:.8em;opacity:.85}

.toast{position:fixed;left:50%;bottom:calc(30% + var(--safe));transform:translate(-50%,10px);background:#111a;backdrop-filter:blur(8px);color:#fff;
  padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-height:560px){ .row .note{display:none} }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="lbl">
      <span>ИТОГО · 总计 · <b id="cnt">0</b> шт/张</span>
      <div class="tools">
        <button onclick="copyRes()" aria-label="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制</button>
        <button onclick="resetAll()" aria-label="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>清零</button>
      </div>
    </div>
    <div class="sum" id="sum">0<span>сум</span></div>
  </div>

  <div class="list" id="list"></div>

  <div class="pad">
    <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button>
    <button class="k f" data-k="back" aria-label="backspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-6 6M11 9l6 6"/></svg></button>
    <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button>
    <button class="k f" data-k="clr">C</button>
    <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button>
    <button class="k go" data-k="next" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span id="goT">Далее</span><small id="goC">下一个</small></button>
    <button class="k f" data-k="-1">−1</button><button class="k" data-k="0">0</button><button class="k f" data-k="+1">+1</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
const root = document.documentElement;
function applyTheme(){
  const dark = tg && tg.colorScheme ? tg.colorScheme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'dark' : 'light';
  if (tg && tg.setHeaderColor){ try{ tg.setHeaderColor(dark?'#0c0e12':'#f3f4f7'); tg.setBackgroundColor(dark?'#0c0e12':'#f3f4f7'); }catch(e){} }
}
if (tg){
  tg.ready(); tg.expand();
  try{ tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
  tg.onEvent && tg.onEvent('themeChanged',applyTheme);
}
applyTheme();

const DEN = [200000,100000,50000,20000,10000,5000,2000,1000];
// основные цвета купюр (примерно); фото кладутся в img/200000.jpg и т.д.
const COL = ['#14a39a','#a8683a','#8a3f9e','#3f7fb8','#c0473a','#3d8f5a','#5a6fb8','#9a6a3a'];
const short = d => d>=1000 ? (d/1000)+'K' : d;
const MAX = 9999;
const cnt = {}; let cur = 0; let fresh = true;
const fmt = n => n.toLocaleString('ru-RU').replace(/\u00a0/g,' ');
const $ = id => document.getElementById(id);

const list = $('list');
DEN.forEach((d,i)=>{
  cnt[d]=0;
  list.insertAdjacentHTML('beforeend',`
  <div class="row" id="r${i}" onclick="select(${i})">
    <div class="note" style="--c:${COL[i]}"><i>${fmt(d)}</i><em>SO'M</em>
      <img src="img/${d}.jpg" alt="" onload="this.parentNode.classList.add('img')" onerror="this.remove()"></div>
    <div class="den"><b>${fmt(d)}</b><small id="s${i}">× 0</small></div>
    <div class="qty" id="q${i}">0</div>
  </div>`);
});

function hap(t='light'){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t); }catch(e){} }
function select(i){
  $('r'+cur).classList.remove('on');
  cur = i; fresh = true;
  const r = $('r'+i); r.classList.add('on');
  r.scrollIntoView({block:'nearest',behavior:'smooth'});
  const last = i===DEN.length-1;
  $('goT').textContent = last ? 'Готово' : 'Далее';
  $('goC').textContent = last ? '完成' : '下一个';
}
function render(i){
  const d=DEN[i], c=cnt[d];
  $('q'+i).textContent = c;
  $('s'+i).textContent = c ? `× ${c} = ${fmt(c*d)}` : '× 0';
  $('r'+i).classList.toggle('has', c>0);
}
function calc(){
  let t=0,p=0; DEN.forEach(d=>{t+=d*cnt[d];p+=cnt[d]});
  $('sum').innerHTML = fmt(t)+'<span>сум</span>'; $('cnt').textContent=p; return t;
}
function press(k){
  const d=DEN[cur];
  if (/^\d$/.test(k)){
    const base = fresh ? 0 : cnt[d];
    const v = base*10 + +k;
    if (v<=MAX) cnt[d]=v;
    fresh=false; hap();
  } else if (k==='back'){ cnt[d]=Math.floor(cnt[d]/10); fresh=false; hap(); }
  else if (k==='clr'){ cnt[d]=0; fresh=true; hap('medium'); }
  else if (k==='+1'){ cnt[d]=Math.min(MAX,cnt[d]+1); fresh=false; hap(); }
  else if (k==='-1'){ cnt[d]=Math.max(0,cnt[d]-1); fresh=false; hap(); }
  else if (k==='next'){
    hap('medium');
    if (cur<DEN.length-1) select(cur+1);
    else { try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); }catch(e){} toast('✓ '+fmt(calc())+' сум'); }
    return;
  }
  render(cur); calc();
}
document.querySelectorAll('.k').forEach(b=>{
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); press(b.dataset.k); });
});
// hold backspace = clear row
let holdT; const back=document.querySelector('[data-k=back]');
back.addEventListener('pointerdown',()=>{ holdT=setTimeout(()=>press('clr'),500); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>back.addEventListener(ev,()=>clearTimeout(holdT)));
// physical keyboard (desktop)
addEventListener('keydown',e=>{
  if (/^\d$/.test(e.key)) press(e.key);
  else if (e.key==='Backspace') press('back');
  else if (e.key==='Enter'||e.key==='ArrowDown') press('next');
  else if (e.key==='ArrowUp' && cur>0) select(cur-1);
});

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1600); }
function resetAll(){
  const go=()=>{ DEN.forEach((d,i)=>{cnt[d]=0;render(i)}); calc(); select(0); list.scrollTop=0; };
  if (!calc()) return go();
  if (tg && tg.showConfirm) tg.showConfirm('Сбросить всё? / 全部清零?', ok=>ok&&go()); else if (confirm('Сбросить всё?')) go();
}
function copyRes(){
  const lines=DEN.filter(d=>cnt[d]).map(d=>`${fmt(d)} × ${cnt[d]} = ${fmt(d*cnt[d])}`);
  const txt=(lines.length?lines.join('\n')+'\n—\n':'')+`ИТОГО: ${fmt(calc())} сум`;
  const ok=()=>toast('Скопировано · 已复制');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,()=>fallback(txt,ok));
  else fallback(txt,ok);
}
function fallback(t,ok){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy');ok()}catch(e){} a.remove(); }

DEN.forEach((d,i)=>render(i)); select(0); calc();
</script>
</body>
</html>
